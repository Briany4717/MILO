version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: milo-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama-models:/root/.ollama
      - ../data/ollama-models:/root/.ollama/models
    environment:
      OLLAMA_HOST: '0.0.0.0'
    restart: unless-stopped
    command: sh -c 'ollama serve'

  milo-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.gpu
    image: milo-server:gpu
    container_name: milo-server
    ports:
      - '8765:8765'
    volumes:
      - ../samples:/home/appuser/samples:ro
      - ../data/voice_embedding.pth:/home/appuser/voice_embedding.pth:ro
      - ../temp:/home/appuser/temp
      - model-cache:/home/appuser/.local/share/tts
      - torch-cache:/home/appuser/.cache/torch
      - transformers-cache:/home/appuser/.cache/huggingface
    environment:
      WEBSOCKET_HOST: '0.0.0.0'
      WEBSOCKET_PORT: '8765'
      OLLAMA_BASE_URL: 'http://ollama:11434'
    depends_on:
      - ollama
    device_requests:
      - driver: nvidia
        count: 1
        capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket,sys; s=socket.socket(); s.settimeout(2); try: s.connect((\"localhost\",8765)); s.close(); except Exception: sys.exit(1)'" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  ollama-models:
  model-cache:
  torch-cache:
  transformers-cache:

networks:
  default:
    driver: bridge
